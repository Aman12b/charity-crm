# Behind Cloudflare + Nginx Proxy Manager the direct peer is the proxy, not the user. Forward the
# real client IP (Cloudflare's CF-Connecting-IP) so the per-IP login rate limit (NFR-SEC-07) does
# not lump all users together, and keep the original scheme (https) set by the outer proxy.
# Without those headers (local docker compose) the behaviour is unchanged.
map $http_cf_connecting_ip $client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  server_tokens off;

  # Security headers (NFR-SEC-06). Repeated in every location because add_header is not inherited
  # once a location defines its own add_header.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
